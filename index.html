<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>파마파미 컬러 시뮬레이터</title>
<style>
 :root{--bg:#faf9f7;--fg:#2b2724;--mut:#8a827b;--line:#e6e1da;--card:#fff;--acc:#2b2724}
 @media (prefers-color-scheme:dark){:root{--bg:#17150f;--fg:#ece7df;--mut:#9c948a;--line:#2f2a24;--card:#201d17;--acc:#ece7df}}
 :root[data-theme="dark"]{--bg:#17150f;--fg:#ece7df;--mut:#9c948a;--line:#2f2a24;--card:#201d17;--acc:#ece7df}
 :root[data-theme="light"]{--bg:#faf9f7;--fg:#2b2724;--mut:#8a827b;--line:#e6e1da;--card:#fff;--acc:#2b2724}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);line-height:1.6;
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
 .wrap{max-width:1200px;margin:0 auto;padding:26px 18px 60px}
 h1{font-size:19px;font-weight:650;margin:0 0 3px;letter-spacing:-.01em}
 .sub{font-size:13px;color:var(--mut);margin:0 0 20px}
 .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
 @media(max-width:900px){.grid{grid-template-columns:1fr}}
 .scene{position:relative;border-radius:12px;overflow:hidden;background:#fff;isolation:isolate;
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 26px rgba(0,0,0,.07)}
 .scene img{display:block;width:100%;height:auto}
 .layer{position:absolute;inset:0;mix-blend-mode:multiply;pointer-events:none;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-mode:alpha;mask-mode:alpha;transition:background-color .18s ease}
 .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px}
 .parts{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
 .part{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--fg);
  border-radius:999px;padding:5px 11px 5px 6px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
 .part:hover{border-color:var(--mut)}
 .part[aria-pressed="true"]{border-color:var(--fg);background:color-mix(in srgb,var(--fg) 7%,transparent);font-weight:600}
 .dot{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.16);flex:none}
 .now{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:14px}
 .now .big{width:34px;height:34px;border-radius:7px;border:1px solid rgba(0,0,0,.14);flex:none}
 .now .txt{min-width:0}
 .now .l1{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .now .l2{font-size:11.5px;color:var(--mut)}
 .gname{font-size:11px;color:var(--mut);margin:13px 0 6px;letter-spacing:.02em}
 .gname:first-of-type{margin-top:0}
 .sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
 .sw button{aspect-ratio:1;border-radius:7px;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0;transition:.12s}
 .sw button:hover{transform:scale(1.1)}
 .sw button[aria-current="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--acc)}
 .palhint{font-size:11.5px;color:var(--mut);margin:0 0 9px}
 .scroll{max-height:330px;overflow-y:auto;padding-right:4px}
 .order{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
 .order h2{font-size:12px;font-weight:600;margin:0 0 8px;color:var(--mut);letter-spacing:.02em}
 .order pre{margin:0 0 9px;padding:11px;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  font-size:12px;line-height:1.75;white-space:pre-wrap;word-break:break-all;
  font-family:ui-monospace,SFMono-Regular,Menlo,"D2Coding",monospace}
 .copy{width:100%;padding:10px;border-radius:8px;border:1px solid var(--fg);background:var(--fg);color:var(--card);
  font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
 .copy:hover{opacity:.85}
 .note{margin-top:20px;font-size:12px;color:var(--mut);border-top:1px solid var(--line);padding-top:13px}

 /* ── 모바일: 이미지 위 · 컬러칩 아래. 이미지는 스크롤해도 붙어 있는다 ── */
 @media (max-width:860px){
  .wrap{padding:14px 12px 44px}
  h1{font-size:17px}
  .sub{font-size:12.5px;margin-bottom:12px}
  .grid{grid-template-columns:1fr;gap:0}
  .scene{position:sticky;top:0;z-index:5;border-radius:0;margin:0 -12px;box-shadow:0 6px 16px rgba(0,0,0,.10)}
  .scene img{max-height:46vh;width:100%;object-fit:cover;object-position:50% 56%}
  .panel{border:0;border-radius:0;padding:14px 0 0;background:transparent}
  .parts{position:sticky;top:calc(46vh - 1px);z-index:4;background:var(--bg);
   margin:0 -12px;padding:10px 12px 8px;gap:6px;border-bottom:1px solid var(--line)}
  .part{padding:7px 13px 7px 8px;font-size:13px}
  .dot{width:17px;height:17px}
  .now{margin-top:12px}
  .scroll{max-height:none;overflow:visible;padding-right:0}
  .sw{grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px}
  .order{position:sticky;bottom:0;background:var(--bg);padding:12px 0 10px;margin-top:18px}
  .copy{padding:13px;font-size:14px}
 }
 @media (max-width:860px) and (orientation:landscape){
  .scene img{max-height:62vh}
  .parts{top:calc(62vh - 1px)}
 }
</style>
</head><body>

<div class="wrap">

const PARTS = [{"key":"quilt","ko":"이불","def":"#cee2d6","su":null},{"key":"mattress","ko":"매트리스커버","def":"#b9a898","su":[60,80]},{"key":"pillowL","ko":"베개 · 왼쪽","def":"#cee2d6","su":null},{"key":"pillowF","ko":"베개 · 앞","def":"#b9a898","su":null},{"key":"pillowW","ko":"베개 · 안쪽","def":"#f1ebdb","su":null}];
const byHex = {};
for (const g of Object.values(SW)) for (const c of g.colors) if(!byHex[c.hex]) byHex[c.hex] = c;

const state = {};
PARTS.forEach(p => state[p.key] = byHex[p.def] || { no:'', en:'', ko:'직접 지정', su:'', hex:p.def });
let cur = PARTS[0];

const $ = s => document.querySelector(s);
const layers = {}, dots = {};
document.querySelectorAll('.layer').forEach(l => layers[l.dataset.part] = l);
document.querySelectorAll('.part').forEach(b => {
  dots[b.dataset.part] = b.querySelector('.dot');
  b.onclick = () => {
    cur = PARTS.find(p => p.key === b.dataset.part);
    document.querySelectorAll('.part').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  };
});

function label(c){ return c.no ? `NO. ${c.no} · ${c.ko} ${c.su}수` : c.ko; }

function apply(c){
  state[cur.key] = c;
  layers[cur.key].style.backgroundColor = c.hex;
  dots[cur.key].style.background = c.hex;
  render();
}
function render(){
  const c = state[cur.key];
  $('#nowSw').style.background = c.hex;
  $('#nowL1').textContent = c.ko + (c.su ? ' ' + c.su + '수' : '');
  $('#nowL2').textContent = (c.no ? 'NO. ' + c.no + '  ·  ' : '') + c.en + '  ·  ' + c.hex.toUpperCase();

  // 부위별로 고를 수 있는 번수만 남긴다
  const allow = cur.su;
  let shown = 0;
  document.querySelectorAll('.sw button').forEach(b => {
    const ok = !allow || allow.includes(+b.dataset.su);
    b.style.display = ok ? '' : 'none';
    if (ok) shown++;
    b.setAttribute('aria-current', ok && b.dataset.hex === c.hex);
  });
  document.querySelectorAll('.grp').forEach(g => {
    const any = [...g.nextElementSibling.children].some(b => b.style.display !== 'none');
    g.style.display = any ? '' : 'none';
    g.nextElementSibling.style.display = any ? '' : 'none';
  });
  $('#palHint').textContent = allow
    ? `매트리스커버는 ${allow.join('·')}수만 됩니다 (100수는 너무 얇습니다) — ${shown}색`
    : `${shown}색`;

  $('#orderTxt').textContent = PARTS.map(p => p.ko + ' : ' + label(state[p.key])).join('\n');
}

const pal = $('#palette');
for (const g of Object.values(SW)) {
  const t = document.createElement('div'); t.className='gname grp'; t.textContent = g.ko + '  ' + g.en;
  pal.appendChild(t);
  const row = document.createElement('div'); row.className='sw';
  g.colors.forEach(c => {
    const b = document.createElement('button');
    b.style.background = c.hex; b.dataset.hex = c.hex; b.dataset.su = c.su;
    b.title = 'NO. ' + c.no + ' ' + c.ko + ' ' + c.su + '수';
    b.onclick = () => apply(c);
    row.appendChild(b);
  });
  pal.appendChild(row);
}

$('#copyBtn').onclick = async () => {
  const t = $('#orderTxt').textContent;
  try { await navigator.clipboard.writeText(t); }
  catch(_) { const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  const b = $('#copyBtn'); const o = b.textContent; b.textContent = '복사했습니다'; setTimeout(()=>b.textContent=o, 1400);
};

render();
</script>
